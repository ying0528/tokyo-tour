name: 部署網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 檢查並建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝套件
        run: npm install --no-audit --no-fund
      - name: 型別檢查
        run: npm run typecheck
      - name: 單元測試（同步、日期、網址）
        run: npm test
      - name: 建置
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 發佈到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  database:
    name: 資料庫權限測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 在暫時的 PostgreSQL 跑 schema.sql 與權限測試
        run: PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" bash tests/sql/run.sh

  supabase:
    name: 檢查 Supabase 設定
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 連線、資料表、登入設定
        run: |
          URL=$(node -p "require('./app.config.json').supabaseUrl")
          KEY=$(node -p "require('./app.config.json').supabaseKey")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::warning::尚未設定 app.config.json"; exit 0; fi
          ok=1
          ping=$(curl -sS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' || true)
          echo "ping: $ping"
          if [ "$ping" = '"ok"' ]; then echo "✅ 資料庫連線正常，schema.sql 已套用"; else echo "::error::資料庫連不上或 schema.sql 沒有成功執行：$ping"; ok=0; fi
          trips=$(curl -sS "$URL/rest/v1/trips?select=id&limit=1" -H "apikey: $KEY" || true)
          echo "trips: $trips"
          case "$trips" in \[*) echo "✅ 資料表存在，且未登入的人看不到資料";; *) echo "::error::讀取 trips 資料表失敗：$trips"; ok=0;; esac
          v3a=$(curl -sS "$URL/rest/v1/activities?select=map_url,links&limit=1" -H "apikey: $KEY" || true)
          v3b=$(curl -sS "$URL/rest/v1/private_notes?select=id&limit=1" -H "apikey: $KEY" || true)
          case "$v3a$v3b" in \[*\]\[*) echo "✅ 第三版資料庫已更新（地圖連結、其他連結、私人備忘錄）";; *) echo "::error::資料庫還是舊版：請到 Supabase SQL Editor 再貼上執行一次 supabase/schema.sql（$v3a $v3b）"; ok=0;; esac
          v4a=$(curl -sS "$URL/rest/v1/lists?select=id,items,shared,editors&limit=1" -H "apikey: $KEY" || true)
          v4b=$(curl -sS "$URL/rest/v1/route_legs?select=id,steps&limit=1" -H "apikey: $KEY" || true)
          v4c=$(curl -sS "$URL/rest/v1/list_checks?select=id,pinned&limit=1" -H "apikey: $KEY" || true)
          v4d=$(curl -sS "$URL/rest/v1/activities?select=images,after_activity_id&limit=1" -H "apikey: $KEY" || true)
          v4e=$(curl -sS "$URL/rest/v1/route_legs?select=plans&limit=1" -H "apikey: $KEY" || true)
          case "$v4a$v4b$v4c$v4d$v4e" in \[*\]\[*\]\[*\]\[*\]\[*) echo "✅ 第四版資料庫已更新（清單、路線方案、行程補充圖片、沒時間的排序）";; *) echo "::error::資料庫還是舊版：請到 Supabase SQL Editor 再貼上執行一次 supabase/schema.sql（$v4a $v4b $v4c $v4d $v4e）"; ok=0;; esac
          storage=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL/storage/v1/object/list/trip-files" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{"prefix":""}' || true)
          echo "storage list: $storage"
          settings=$(curl -sS "$URL/auth/v1/settings" -H "apikey: $KEY" || true)
          echo "$settings" | node -e '
            const s = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const anon = s.external?.anonymous_users ?? s.anonymous_users;
            console.log(s.external?.email ? "✅ Email 登入已開啟" : "::error::Email 登入沒有開啟");
            console.log(anon ? "✅ 匿名登入已開啟（家人免註冊）" : "::error::匿名登入沒有開啟：Authentication → Sign In / Providers → Allow anonymous sign-ins");
            console.log(s.disable_signup ? "::error::目前關閉了註冊（Allow new users to sign up）" : "✅ 允許註冊");
            console.log(s.mailer_autoconfirm ? "ℹ️ 註冊不需要點確認信" : "ℹ️ 註冊後需要到信箱點確認信");
            if (!s.external?.email || !anon || s.disable_signup) process.exit(1);
          ' || ok=0
          [ "$ok" = 1 ]
