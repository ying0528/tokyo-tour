name: 保持資料庫喚醒

# Supabase 免費專案閒置一週會暫停；每 3 天自動連一次，讓它保持開著。
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 連一下資料庫
        run: |
          URL=$(node -p "require('./app.config.json').supabaseUrl")
          KEY=$(node -p "require('./app.config.json').supabaseKey")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "尚未設定 app.config.json，略過"; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
      - name: 避免 GitHub 因專案太久沒更新而停用這個排程
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "距離上次更新 $days 天"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "保持排程啟用"
            git push
          fi
